plugins {
    id 'java'
    id 'application'
}

group = 'mx.edu.tecdesoftware'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'org.postgresql:postgresql:42.7.13'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'PendixAppServer'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

def executableJar = tasks.named('jar', Jar) {
    archiveFileName = 'PendixAPP.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory()
                    ? dependency
                    : zipTree(dependency)
        }
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.register('awsBundle', Zip) {
    group = 'distribution'
    description = 'Genera el paquete para AWS Elastic Beanstalk.'

    dependsOn executableJar

    archiveFileName = 'PendixAPP-aws.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(executableJar.flatMap { it.archiveFile })

    from('Procfile')

    from('.ebextensions') {
        into '.ebextensions'
    }
}
