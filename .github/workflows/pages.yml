name: PendixAPP - CI/CD GitHub Pages

on:
  push:
    branches:
      - Entrega-Final

  pull_request:
    branches:
      - Entrega-Final

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Give Gradle execution permission
        run: chmod +x PendixAPP/gradlew

      - name: Run automated tests
        working-directory: PendixAPP
        run: ./gradlew clean test --no-daemon

      - name: Prepare GitHub Pages frontend
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          if [ -d "PendixAPP/src/main/resources/static" ]; then
            FRONTEND="PendixAPP/src/main/resources/static"
          elif [ -d "PendixAPP/src/main/resources/public" ]; then
            FRONTEND="PendixAPP/src/main/resources/public"
          else
            echo "Frontend folder was not found."
            exit 1
          fi

          cp -R "$FRONTEND"/. _site/
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/app.js

          echo "Frontend prepared from $FRONTEND"
          find _site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pendixapp-test-report
          path: PendixAPP/build/reports/tests/test/
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
