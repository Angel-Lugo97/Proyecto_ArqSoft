name: PendixAPP - Test and Deploy

on:
  push:
    branches:
      - Entrega-Final
  pull_request:
    branches:
      - Entrega-Final
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Give Gradle execution permission
        run: chmod +x PendixAPP/gradlew

      - name: Run automated tests
        working-directory: PendixAPP
        run: ./gradlew clean test --no-daemon

      - name: Prepare static frontend
        run: |
          mkdir -p _site
          cp -R PendixAPP/src/main/resources/static/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload Gradle test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pendixapp-test-report
          path: PendixAPP/build/reports/tests/test/
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: validate

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
